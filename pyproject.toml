[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kod-link-dify"
version = "0.1.0"
description = "Python client for linking Kod and Dify API"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Xu Xinping", email = "xinping_xu@qq.com"},
]
dependencies = [
    "requests>=2.25",
    "pytest>=6.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]